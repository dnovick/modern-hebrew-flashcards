name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installed explicitly rather than from requirements.txt: the TTS client pulls in
      # the whole google-cloud tree for no benefit here, and coverage floors must be
      # measured against exactly this package list. A local environment with extra
      # packages measures a number CI can never reach — see docs/policies/test-coverage.md.
      - name: Install dependencies
        run: pip install PyYAML pydantic genanki pytest pytest-cov flake8 mypy

      - name: Lint
        run: python -m flake8 src/ scripts/ tests/ conftest.py

      - name: Type check
        run: python -m mypy src/ --ignore-missing-imports

      # Integration tests need the owner's local Anki collection, which no runner has.
      # They are designed to skip rather than fail when it is absent.
      - name: Tests
        run: python -m pytest -m "not integration" -q

      - name: Coverage ratchet
        run: python scripts/check_coverage.py
