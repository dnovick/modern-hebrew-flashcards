[metadata]
name = modern-hebrew-flashcards
version = 0.1.0

[options]
package_dir =
    = src
packages = find:

[options.packages.find]
where = src

[flake8]
max-line-length = 120
# __init__.py contains intentional re-exports — F401 is expected there
per-file-ignores =
    src/hebrew_cards/__init__.py: F401

[mypy]
ignore_missing_imports = True
warn_unused_ignores = True
warn_return_any = False
disallow_untyped_defs = True
check_untyped_defs = True

[coverage:run]
branch = True
omit =
    */__pycache__/*
    */.venv/*
    tests/*

[coverage:report]
precision = 2
skip_covered = False
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
